{% extends 'base.html' %}
{% block content %}<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><div class="card border-0 shadow-sm p-4"><h2 class="fw-bold">Schedule interview</h2><p class="text-muted">{{ application.student.user.username }} · {{ application.job.title }}</p><form method="post">{% csrf_token %}<label class="form-label">Round</label><input class="form-control mb-3" name="round_name" value="Technical Interview"><label class="form-label">Date and time</label><input class="form-control mb-3" type="datetime-local" name="scheduled_at" required><label class="form-label">Mode</label><select class="form-select mb-3" name="mode"><option value="ONLINE">Online</option><option value="ONSITE">Onsite</option></select><label class="form-label">Meeting link</label><input class="form-control mb-3" type="url" name="meeting_link"><label class="form-label">Location</label><input class="form-control mb-4" name="location"><button class="btn btn-primary" type="submit">Schedule and notify student</button></form></div></div></div></main>{% endblock %}
