{% extends 'base.html' %}
{% block content %}
<main class="container py-5"><div class="row justify-content-center"><div class="col-lg-8"><div class="profile-card card border-0 shadow-sm p-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><span class="eyebrow">Student profile</span><h1 class="h3 fw-bold mb-0">{{ title }}</h1></div><a href="{% url 'student_profile' %}" class="btn btn-outline-primary">Back to profile</a></div><form method="post" enctype="multipart/form-data">{% csrf_token %}{% if form.non_field_errors %}<div class="alert alert-danger">{{ form.non_field_errors }}</div>{% endif %}<div class="row g-3">{% for field in form %}<div class="{% if field.name == 'description' %}col-12{% else %}col-md-6{% endif %}"><label class="form-label small fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}</div><div class="text-end mt-4"><button class="btn btn-primary" type="submit">Save {{ title }}</button></div></form></div></div></div></main>
{% endblock %}
