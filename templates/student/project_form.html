{% extends 'base.html' %}
{% block content %}
<div class="container py-5" style="max-width: 760px;">
    <div class="card border-0 shadow-sm p-4 p-lg-5">
        <a href="{% url 'student_profile' %}" class="small text-decoration-none mb-3"><i class="bi bi-arrow-left me-1"></i>Back to profile</a>
        <h1 class="h3 fw-bold mb-4">Edit project</h1>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.non_field_errors }}
            <div class="row g-3">{% for field in form %}<div class="{% if field.name == 'description' %}col-12{% else %}col-md-6{% endif %}"><label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{% for error in field.errors %}<div class="text-danger small">{{ error }}</div>{% endfor %}</div>{% endfor %}</div>
            <div class="d-flex justify-content-end gap-2 mt-4"><a href="{% url 'student_profile' %}" class="btn btn-light">Cancel</a><button class="btn btn-primary" type="submit">Update project</button></div>
        </form>
    </div>
</div>
{% endblock %}
