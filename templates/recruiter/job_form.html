{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow-sm border-0">
                <div class="card-body p-4 p-lg-5">
                    <h2 class="fw-bold mb-4">Post a new opportunity</h2>
                    <form method="post">
                        {% csrf_token %}
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Job title</label>
                                <input class="form-control" type="text" name="title" value="{{ job.title|default:'' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Location</label>
                                <input class="form-control" type="text" name="location" value="{{ job.location|default:'' }}" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Job type</label>
                                <select class="form-select" name="job_type">
                                    <option>Full-Time</option>
                                    <option>Internship</option>
                                    <option>Contract</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Work mode</label>
                                <select class="form-select" name="work_mode">
                                    <option>Onsite</option>
                                    <option>Hybrid</option>
                                    <option>Remote</option>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label">Description</label>
                                <textarea class="form-control" name="description" rows="4" required>{{ job.description|default:'' }}</textarea>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Salary</label>
                                <input class="form-control" type="text" name="salary" value="{{ job.salary|default:'' }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Minimum CGPA</label>
                                <input class="form-control" type="number" step="0.1" name="minimum_cgpa" value="{{ job.minimum_cgpa|default:0 }}">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Application deadline</label>
                                <input class="form-control" type="text" name="application_deadline" value="{{ now|date:'Y-m-d H:i:s' }}">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Required skills</label>
                                <select class="form-select" name="required_skills" multiple size="6">
                                    {% for skill in skills %}
                                    <option value="{{ skill.id }}">{{ skill.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Preferred skills</label>
                                <select class="form-select" name="preferred_skills" multiple size="6">
                                    {% for skill in skills %}
                                    <option value="{{ skill.id }}">{{ skill.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Maximum backlogs</label>
                                <input class="form-control" type="number" name="maximum_backlogs" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Graduation year</label>
                                <input class="form-control" type="number" name="graduation_year" value="2026">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Eligible degree</label>
                                <input class="form-control" type="text" name="eligible_degree" value="{{ job.eligible_degree|default:'' }}" placeholder="e.g. B.Tech">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Experience (years)</label>
                                <input class="form-control" type="number" step="0.1" min="0" name="experience_required" value="{{ job.experience_required|default:0 }}">
                            </div>
                            <div class="col-12">
                                <label class="form-label">Required languages</label>
                                <input class="form-control" type="text" name="required_programming_languages" value="{{ job.required_programming_languages|default:'' }}" placeholder="Python, Java">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Required frameworks</label>
                                <input class="form-control" type="text" name="required_frameworks" value="{{ job.required_frameworks|default:'' }}" placeholder="Django, Spring Boot">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Required technologies</label>
                                <input class="form-control" type="text" name="required_technologies" value="{{ job.required_technologies|default:'' }}" placeholder="REST API, Docker">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Internship type</label>
                                <select class="form-select" name="internship_type">
                                    <option>Full-Time</option>
                                    <option>Internship</option>
                                    <option>Contract</option>
                                </select>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-4">
                            <a href="{% url 'recruiter_dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                            <button class="btn btn-primary" type="submit">Publish Job</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
